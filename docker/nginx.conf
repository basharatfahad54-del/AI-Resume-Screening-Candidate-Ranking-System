# TalentMatch web client: static SPA + same-origin API proxy.
#
# Served by nginxinc/nginx-unprivileged, which already runs as a non-root user
# on port 8080 with a writable pid path and cache dir. No root, no capabilities.

# Docker's embedded DNS. Without an explicit resolver, nginx resolves the
# upstream hostname once at startup and keeps the address forever, so recreating
# the API container (new IP) silently breaks the proxy until nginx is reloaded.
# With a variable upstream, the name is re-resolved on the TTL instead.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded resumes can be up to MAX_UPLOAD_SIZE_MB (10 MB); leave headroom.
    client_max_body_size 12m;
    client_body_timeout 60s;

    # Uploaded documents are user content: never let the browser sniff a type.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    # 'unsafe-inline' for styles only, because Vite inlines critical CSS in the
    # HTML. Scripts stay strict, so an injected inline script cannot run.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are immutable, so cache them for a year. `expires` is
    # used instead of `add_header Cache-Control` on purpose: add_header inside a
    # location *replaces* the server-level header set, which would silently drop
    # the CSP and nosniff from every script and stylesheet. `immutable` is
    # omitted because the filename changes whenever the content does, so
    # max-age is already sufficient.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # The shell must always be revalidated, or a deploy leaves browsers on the
    # old bundle that references hashed assets which no longer exist.
    location = /index.html {
        expires -1;
    }

    # Client-side routing: unknown paths render the SPA, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health probes hit this constantly; keep it out of the access log.
    location = /api/health {
        set $api_health http://backend:8000;
        proxy_pass $api_health/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        access_log off;
    }

    # ---- API ----
    location /api/ {
        set $api_upstream http://backend:8000;
        # No URI part: the original request URI (/api/...) is passed through
        # unchanged, so /api/v1 prefix handling stays with the application.
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Matching/summary calls can take a while on a large pool.
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        # Uploads and downloads must stream, not buffer into nginx temp files.
        proxy_request_buffering off;
        proxy_buffering off;
    }
}