[project]
name = "ai-resume-screening-backend"
version = "0.2.0"
description = "AI-powered resume screening and candidate ranking API"
requires-python = ">=3.10"
# No `readme` key on purpose: the only README lives at the repository root and
# setuptools refuses to read metadata files from outside the project directory.

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `app` importable no matter how pytest is invoked. The `pytest` console
# script does not add the working directory to sys.path the way
# `python -m pytest` does, so without this the suite only passes locally.
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
addopts = "--strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:passlib.*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]
ignore = ["B008", "E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
plugins = []
