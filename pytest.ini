# Pytest defaults for running from the repository root, e.g. `python -m pytest ml`.
#
# The backend has its own configuration in backend/pyproject.toml (asyncio auto
# mode, session-scoped event loop, strict markers) and that still wins when the
# working directory is backend/, because pytest picks the config closest to the
# test paths.

[pytest]
# Scope the loop explicitly: leaving it unset makes pytest-asyncio warn and then
# change behaviour in a future release.
asyncio_default_fixture_loop_scope = function

# A bare `pytest` at the root must not collect backend/tests: those expect the
# backend as the rootdir with its own settings and dependencies.
testpaths = ml/tests

filterwarnings =
    error::pytest.PytestUnraisableExceptionWarning